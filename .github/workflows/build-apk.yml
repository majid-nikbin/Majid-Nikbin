name: Build Offline Android APK & Deploy Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Assets
        run: |
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: dist
          clean: true

      - name: Upload GitHub Pages Artifact (Official Direct Deploy)
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist

      - name: Deploy to GitHub Pages Live
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Install & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/browser
          npx cap init "Mariner Pro" "com.mariner.pro" --web-dir "dist"
          npx cap add android
          npx cap sync android

      - name: Configure App Icon & Modern Adaptive Icons (All Densities)
        run: |
          # 1. Identify user's chosen custom app icon in priority order
          ICON_SRC=""
          for candidate in "assets/icon.png" "assets/icon.jpg" "public/app-icon.jpg" "public/app-icon.png" "public/icon-512.png" "public/icon.png"; do
            if [ -f "$candidate" ] && [ -s "$candidate" ]; then
              ICON_SRC="$candidate"
              echo "==> Using App Icon Source: $ICON_SRC"
              break
            fi
          done

          if [ -n "$ICON_SRC" ]; then
            # Copy to all mipmap density folders (legacy + adaptive foreground)
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              TARGET_DIR="android/app/src/main/res/$d"
              mkdir -p "$TARGET_DIR"
              cp "$ICON_SRC" "$TARGET_DIR/ic_launcher.png"
              cp "$ICON_SRC" "$TARGET_DIR/ic_launcher_round.png"
              cp "$ICON_SRC" "$TARGET_DIR/ic_launcher_foreground.png"
            done

            # Ensure modern Android Adaptive Icon XML is properly configured (Android 8.0+ / API 26-35)
            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
</adaptive-icon>
EOF

            cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
</adaptive-icon>
EOF

            mkdir -p android/app/src/main/res/values
            cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#0F172A</color>
</resources>
EOF
          fi

      - name: Configure Keystore Signing, VersionCode & Hardware Permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <uses-permission android:name="android.permission.USB_PERMISSION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST_PATH
          fi

          # 1. Strip x86 emulator binaries to reduce APK size to ~4MB
          sed -i "s/defaultConfig {/defaultConfig {\n        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }/g" android/app/build.gradle

          # 2. Dynamic Incremental VersionCode: Ensures every update installs directly over older APKs
          BUILD_NUM=${{ github.run_number }}
          sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUM\"/g" android/app/build.gradle

          # 3. Persistent Fixed Keystore Signing: Ensures EVERY GitHub build has the EXACT same signature!
          # This prevents "App not installed" signature mismatch and eliminates the need to uninstall!
          if [ ! -f mariner-release.keystore ] && [ -f mariner-keystore.b64 ]; then
            base64 -d mariner-keystore.b64 > mariner-release.keystore
          fi
          cp mariner-release.keystore android/mariner-release.keystore

          python3 -c "
with open('android/app/build.gradle', 'r') as f:
    content = f.read()

signing_block = '''
    signingConfigs {
        release {
            storeFile file('../mariner-release.keystore')
            storePassword 'mariner1234'
            keyAlias 'mariner'
            keyPassword 'mariner1234'
        }
    }
'''
if 'signingConfigs {' not in content:
    content = content.replace('android {', 'android {' + signing_block)

content = content.replace('buildTypes {', '''buildTypes {
        debug {
            signingConfig signingConfigs.release
        }''')
content = content.replace('release {', '''release {
            signingConfig signingConfigs.release''')

with open('android/app/build.gradle', 'w') as f:
    f.write(content)
"

      - name: Build Android APK with Gradle (Signed with Persistent Keystore)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Mariner-Pro-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

