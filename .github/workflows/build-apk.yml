name: Build Offline Android APK & Deploy Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Assets
        run: |
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: dist
          clean: true

      - name: Upload GitHub Pages Artifact (Official Direct Deploy)
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist

      - name: Deploy to GitHub Pages Live
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Install & Configure Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/browser
          npx cap init "Mariner Pro" "com.mariner.pro" --web-dir "dist"
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions, Adaptive Icons, Versioning & Keystore Signing
        run: node scripts/setup-android-build.cjs ${{ github.run_number }}

      - name: Build Android APK with Gradle (Signed with Persistent Keystore)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Mariner-Pro-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

